# Publishes the web app to GitHub Pages: https://<owner>.github.io/reycam/
# Open it in Safari on iPhone and use Share → Add to Home Screen to install it.
name: Web app (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="$(mktemp -d)"
          cp -a web/dist/. "$DEPLOY_DIR/"
          touch "$DEPLOY_DIR/.nojekyll"
          cd "$DEPLOY_DIR"
          git init --initial-branch=gh-pages
          git config user.name "GUTOMADON"
          git config user.email "144855223+GUTOMADON@users.noreply.github.com"
          git add --all
          git commit -m "Deploy $GITHUB_SHA"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
